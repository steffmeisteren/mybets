<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mine spill · Oddsenoversikt</title>
  <style>
    :root {
      --ink: #0b1110;
      --paper: #fffaf0;
      --gold: #d8aa49;
      --green: #10a66f;
      --blue: #2f72ff;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 112px),
        linear-gradient(180deg, #070908 0%, #11231b 34%, #0b5038 100%);
      font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(118deg, transparent 0 16%, rgba(255,255,255,0.16) 16% 17%, transparent 17% 42%, rgba(255,255,255,0.08) 42% 43%, transparent 43%),
        linear-gradient(242deg, transparent 0 20%, rgba(255,255,255,0.10) 20% 21%, transparent 21% 54%, rgba(255,255,255,0.08) 54% 55%, transparent 55%);
      mix-blend-mode: screen;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hero {
      min-height: 224px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
      gap: 18px;
      align-items: end;
      padding: 20px 0 18px;
      border-bottom: 1px solid rgba(255,250,240,0.18);
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .kicker::before,
    .kicker::after {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--gold);
    }

    h1 {
      margin: 0;
      max-width: 660px;
      color: var(--paper);
      font-family: Bahnschrift, "Aptos Display", Impact, sans-serif;
      font-size: 58px;
      line-height: 0.92;
      font-weight: 900;
    }

    h1 span {
      color: var(--gold);
    }

    .hero p {
      max-width: 610px;
      margin: 18px 0 0;
      color: #d2cec4;
      font-size: 16px;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .import-trigger {
      min-height: 46px;
      padding: 0 18px;
      border-color: var(--gold);
      background: var(--gold);
      color: #171109;
      box-shadow: 0 12px 30px rgba(216,170,73,0.18);
    }

    .hero-actions > span {
      color: #d4d0c7;
      font-size: 12px;
      font-weight: 700;
      text-transform: none;
    }

    .scoreboard,
    .final {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .scoreboard {
      padding: 8px;
      border: 1px solid rgba(255,250,240,0.22);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03)), rgba(4,8,7,0.72);
      box-shadow: 0 22px 70px rgba(0,0,0,0.32);
    }

    .stat {
      min-height: 64px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid rgba(255,250,240,0.16);
      border-radius: 8px;
      background: rgba(255,250,240,0.06);
    }

    .stat span,
    .stat em {
      color: #f7f3ea;
      font-size: 11px;
      font-style: normal;
      font-weight: 700;
      line-height: 1.25;
      text-transform: none;
    }

    .stat strong {
      color: #fffdf8;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 21px;
      line-height: 1;
    }

    .green strong { color: #35d992; }
    .blue strong, .sharp strong { color: #69a1ff; }
    .bold strong { color: #ffc056; }
    .moonshot strong { color: #ff7a3d; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 18px 0;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #e1ddd4;
      font-size: 12px;
      font-weight: 700;
      text-transform: none;
    }

    .legend i {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(255,255,255,0.34);
      background: var(--cat);
    }

    .selection {
      position: sticky;
      top: 12px;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(210px, 1fr) repeat(3, minmax(128px, auto)) auto;
      gap: 10px;
      align-items: stretch;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid rgba(255,250,240,0.22);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(216,170,73,0.20), rgba(255,250,240,0.05)), rgba(4,8,7,0.88);
      box-shadow: 0 18px 52px rgba(0,0,0,0.30);
      backdrop-filter: blur(12px);
    }

    .selection-copy,
    .selection-metric {
      min-height: 58px;
      display: grid;
      align-content: center;
      gap: 3px;
      padding: 9px 11px;
      border: 1px solid rgba(255,250,240,0.14);
      border-radius: 8px;
      background: rgba(255,250,240,0.06);
    }

    .selection-copy span,
    .selection-metric span {
      color: #f4c85a;
      font-size: 10px;
      font-weight: 800;
      text-transform: none;
    }

    .selection-copy strong,
    .selection-metric strong {
      color: #fffdf8;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 17px;
      line-height: 1.05;
    }

    .selection-copy p {
      margin: 0;
      color: rgba(255,250,240,0.68);
      font-size: 11px;
      line-height: 1.35;
    }

    .selection-metric.green strong {
      color: #35d992;
    }

    .selection button {
      min-height: 58px;
      align-self: stretch;
      border-color: rgba(216,170,73,0.52);
      background: var(--gold);
      color: #14100a;
    }

    .selection button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .selection-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .selection-actions button {
      min-height: 31px;
    }

    .selection-actions .delete-selected {
      border-color: rgba(205,73,54,0.55);
      background: rgba(118,26,20,0.42);
      color: #ffe9e3;
    }

    .match {
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,250,240,0.20);
      border-radius: 8px;
      background: #fffaf0;
      color: var(--ink);
      box-shadow: 0 26px 70px rgba(0,0,0,0.26);
    }

    .match-top {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(420px, 0.92fr);
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(9,17,15,0.96), rgba(23,33,29,0.92));
      color: var(--paper);
      border-bottom: 4px solid var(--accent);
    }

    .match-title > span {
      display: block;
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .match-title h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-family: Bahnschrift, "Aptos Display", Impact, sans-serif;
    }

    .match-title b {
      min-width: 92px;
      padding: 8px 10px 7px;
      border: 1px solid rgba(255,255,255,0.26);
      border-bottom: 3px solid var(--accent);
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: var(--paper);
      font-size: 38px;
      line-height: 1;
      text-align: center;
    }

    .match-title b:last-of-type {
      border-bottom-color: var(--rival);
    }

    .match-title small {
      color: #d5d1c8;
      font-size: 15px;
      font-weight: 900;
    }

    .match-title p {
      margin: 12px 0 0;
      color: #d2cec4;
      font-size: 13px;
    }

    .match-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .delete-match {
      flex: 0 0 auto;
      min-height: 36px;
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
      color: rgba(255,250,240,0.78);
    }

    .delete-match:hover,
    .delete-match:focus-visible {
      border-color: #ff8974;
      background: rgba(157,42,29,0.38);
      color: #fff;
    }

    .special-event-title {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .special-event-title strong {
      color: var(--paper);
      font-family: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", sans-serif;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .special-event-title small {
      color: #d2cec4;
      font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      font-weight: 650;
    }

    .match-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .match-metrics .stat {
      min-height: 58px;
      padding: 9px 10px;
    }

    .match-metrics .stat span,
    .match-metrics .stat em {
      color: #f7f3ea;
      font-size: 10px;
      font-weight: 700;
      text-transform: none;
    }

    .match-metrics .stat strong {
      font-size: 15px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(11,17,16,0.10);
      background: #f4ecda;
    }

    .sort {
      display: grid;
      grid-template-columns: 18px 22px 40px minmax(220px, 1fr) 76px 88px 112px 22px;
      align-items: center;
      gap: 6px;
      padding: 7px 12px 9px;
      border-bottom: 1px solid rgba(11,17,16,0.10);
      background: #f4ecda;
    }

    button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgba(11,17,16,0.18);
      border-radius: 8px;
      background: rgba(255,255,255,0.56);
      color: #1b2723;
      font: 800 12px "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .sort button small {
      min-height: 20px;
      display: grid;
      place-items: center;
      padding: 0 7px;
      border-radius: 6px;
      background: rgba(11,17,16,0.10);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
    }

    .sort-reset {
      grid-column: 4;
    }

    .sort-odds {
      grid-column: 5;
    }

    .sort-stake {
      grid-column: 6;
    }

    .sort-payout {
      grid-column: 7;
    }

    .sort-odds,
    .sort-stake,
    .sort-payout {
      width: 100%;
      justify-content: center;
      padding: 0 8px;
    }

    .sort-reset {
      width: auto;
      min-width: 92px;
      justify-self: end;
      justify-content: center;
      padding: 0 14px;
    }

    button span {
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(11,17,16,0.10);
      font-family: "Cascadia Mono", Consolas, monospace;
    }

    button.is-active {
      background: var(--filter, var(--accent));
      border-color: var(--filter, var(--accent));
      color: white;
    }

    button.is-active span {
      background: rgba(255,255,255,0.22);
    }

    .sort button.is-active small {
      background: rgba(255,255,255,0.22);
    }

    .bet {
      position: relative;
      display: grid;
      grid-template-columns: 18px 22px 40px minmax(220px, 1fr) 76px 88px 112px 22px;
      gap: 6px;
      align-items: center;
      min-height: 40px;
      padding: 2px 10px;
      border-bottom: 1px solid rgba(11,17,16,0.10);
      background: linear-gradient(90deg, color-mix(in srgb, var(--cat) 9%, transparent), transparent 32%), rgba(255,255,255,0.45);
    }

    .bet.selected {
      background: linear-gradient(90deg, rgba(216,170,73,0.25), color-mix(in srgb, var(--cat) 12%, transparent) 38%, transparent), white;
      box-shadow: inset 0 0 0 2px rgba(216,170,73,0.52);
    }

    .bet::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--cat);
    }

    .delete-bet {
      position: static;
      grid-column: 8;
      justify-self: end;
      width: 20px;
      min-height: 20px;
      justify-content: center;
      padding: 0;
      border-color: rgba(170,47,33,0.22);
      background: rgba(255,255,255,0.78);
      color: #a52d22;
      font-size: 14px;
      line-height: 1;
    }

    .select-bet {
      position: relative;
      display: grid;
      place-items: center;
    }

    .select-bet input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .select-bet label {
      width: 16px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(11,17,16,0.18);
      border-radius: 8px;
      background: rgba(255,255,255,0.62);
      cursor: pointer;
    }

    .select-bet input:focus-visible + label {
      outline: 3px solid rgba(216,170,73,0.48);
      outline-offset: 2px;
    }

    .select-bet input:checked + label {
      border-color: #b88924;
      background: var(--gold);
    }

    .check {
      color: transparent;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }

    .select-bet input:checked + label .check {
      color: #14100a;
    }

    .marker {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--cat) 50%, white);
      border-radius: 8px;
      background: color-mix(in srgb, var(--cat) 13%, white);
      color: color-mix(in srgb, var(--cat) 86%, #101010);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 9px;
      font-weight: 900;
    }

    .main span {
      display: block;
      color: #5b625f;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.05;
      text-transform: none;
      margin-bottom: 1px;
    }


    .num > span {
      display: block;
      color: #626965;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      text-transform: none;
      margin-bottom: 1px;
    }

    .main strong {
      display: block;
      overflow-wrap: anywhere;
      color: #101513;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.05;
    }

    .num {
      text-align: right;
    }

    .num strong {
      display: block;
      color: var(--ink);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 14px;
      line-height: 1;
    }

    .odds strong {
      font-size: 16px;
    }

    .bet.sharp .odds strong { color: #1f6fff; }
    .bet.bold .odds strong { color: #b56c00; }
    .bet.moonshot .odds strong { color: #c24812; }

    .payout strong {
      color: #008f60;
      font-size: 15px;
    }

    .payout em {
      display: block;
      color: #167a56;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 8px;
      line-height: 1;
      font-style: normal;
      margin-top: 1px;
    }

    .match-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-top: 1px solid rgba(11,17,16,0.10);
      background: #efe5cf;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .match-footer strong {
      color: #007f56;
      font-family: "Cascadia Mono", Consolas, monospace;
    }

    .final {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 16px;
    }

    .final .stat {
      min-height: 96px;
      background: rgba(4,8,7,0.66);
    }

    .empty-dashboard {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 56px 24px;
      border: 1px solid rgba(255,250,240,0.20);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(4,8,7,0.82), rgba(17,48,37,0.74));
      box-shadow: 0 26px 70px rgba(0,0,0,0.24);
      text-align: center;
    }

    .empty-dashboard > div {
      width: min(560px, 100%);
    }

    .empty-number {
      display: block;
      color: var(--gold);
      font: 900 64px/1 "Cascadia Mono", Consolas, monospace;
    }

    .empty-dashboard h2 {
      margin: 12px 0 8px;
      color: var(--paper);
      font-family: Bahnschrift, "Aptos Display", Impact, sans-serif;
      font-size: 34px;
    }

    .empty-dashboard p {
      margin: 0 auto 22px;
      color: rgba(255,250,240,0.68);
      font-size: 15px;
      line-height: 1.5;
    }

    .empty-import {
      min-height: 46px;
      border-color: var(--gold);
      background: var(--gold);
      color: #171109;
    }

    .import-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(2,6,5,0.78);
      backdrop-filter: blur(12px);
    }

    .import-panel {
      width: min(980px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      border: 1px solid rgba(255,250,240,0.24);
      border-radius: 8px;
      background: #fffaf0;
      color: var(--ink);
      box-shadow: 0 30px 100px rgba(0,0,0,0.52);
    }

    .confirm-panel {
      width: min(460px, 100%);
      padding: 24px;
      border: 1px solid rgba(255,250,240,0.24);
      border-top: 4px solid #d45743;
      border-radius: 8px;
      background: #fffaf0;
      color: var(--ink);
      box-shadow: 0 30px 100px rgba(0,0,0,0.52);
    }

    .confirm-panel > span {
      color: #a83b2d;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .confirm-panel h2 {
      margin: 7px 0 8px;
      font-family: Bahnschrift, "Aptos Display", Impact, sans-serif;
      font-size: 28px;
    }

    .confirm-panel p {
      margin: 0;
      color: rgba(11,17,16,0.68);
      line-height: 1.5;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 22px;
    }

    .confirm-delete {
      border-color: #a83b2d;
      background: #b94132;
      color: #fff;
    }

    .import-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 4px solid var(--gold);
      background: #111b17;
      color: var(--paper);
    }

    .import-head span {
      display: block;
      margin-bottom: 4px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .import-head h2 {
      margin: 0;
      font-family: Bahnschrift, "Aptos Display", Impact, sans-serif;
      font-size: 28px;
      line-height: 1;
    }

    .import-close {
      width: 40px;
      min-height: 40px;
      justify-content: center;
      padding: 0;
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 24px;
    }

    .import-body {
      padding: 20px;
    }

    .import-modes {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(11,17,16,0.16);
      border-radius: 8px;
      background: #eee3cd;
    }

    .import-modes button {
      justify-content: center;
      border-color: transparent;
      background: transparent;
    }

    .import-modes button.is-active {
      border-color: #17221e;
      background: #17221e;
      color: white;
    }

    .import-source {
      margin-top: 16px;
    }

    .import-label {
      display: block;
      margin-bottom: 8px;
      color: rgba(11,17,16,0.64);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .import-textarea {
      width: 100%;
      min-height: 224px;
      resize: vertical;
      padding: 16px;
      border: 1px solid rgba(11,17,16,0.22);
      border-radius: 8px;
      background: #fffdf8;
      color: var(--ink);
      font: 14px/1.55 "Cascadia Mono", Consolas, monospace;
    }

    .import-textarea:focus,
    .review-field input:focus,
    .review-field select:focus {

    .dropzone {
      min-height: 250px;
      display: grid;
      place-items: center;
      padding: 28px;
      border: 2px dashed rgba(11,17,16,0.28);

    .dropzone.is-dragging {

    }

    .dropzone strong {

      font-size: 22px;
    }

    .dropzone span {
      display: block;
      margin-top: 7px;
      color: rgba(11,17,16,0.58);
      font-size: 13px;
    }

    .image-queue {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .image-item {
      position: relative;
      min-height: 116px;
      overflow: hidden;
      border: 1px solid rgba(11,17,16,0.16);
      border-radius: 8px;
      background: #e8dfcd;
    }

    .image-item img {
      width: 100%;
      height: 116px;
      display: block;
      object-fit: cover;
    }

    .image-item button {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 30px;
      min-height: 30px;
      justify-content: center;
      padding: 0;
      background: rgba(10,15,13,0.84);
      color: white;
    }

    .ocr-status {
      display: grid;
      gap: 7px;
      margin-top: 14px;
      color: rgba(11,17,16,0.70);
      font-size: 13px;
      font-weight: 800;
    }

    .ocr-track {
      height: 7px;
      overflow: hidden;
      border-radius: 4px;
      background: #e1d6be;
    }

    .ocr-track i {
      width: var(--progress, 0%);
      height: 100%;
      display: block;
      background: var(--green);
      transition: width 180ms ease;
    }

    .review-list {
      display: grid;
      gap: 10px;
    }

    .review-row {
      position: relative;
      display: grid;
      grid-template-columns: 1.05fr 1.15fr 1.15fr 94px 110px 120px;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(11,17,16,0.16);
      border-left: 5px solid var(--cat);
      border-radius: 8px;
      background: #fffdf8;
    }

    .review-row.has-source {
      grid-template-columns: 180px repeat(3, minmax(0, 1fr));
    }

    .review-row.is-uncertain {
      border-left-color: #d28a25;
      background: #fff8e7;
    }

    .review-row.is-rejected {
      border-left-color: #b94132;
      background: #fff0ec;
    }

    .review-source {
      grid-row: span 3;
      min-width: 0;
    }

    .review-source img {
      width: 100%;
      max-height: 300px;
      display: block;
      object-fit: contain;
      object-position: top;
      border: 1px solid rgba(11,17,16,0.16);
      border-radius: 6px;

    .review-source small {

      margin-top: 7px;
      color: rgba(11,17,16,0.58);
      font: 10px/1.45 "Cascadia Mono", Consolas, monospace;
    }

    .review-summary {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;

    .review-summary strong,
    .review-summary span {
      padding: 5px 8px;

      font-size: 11px;

    }

    .review-summary .complete { color: #087c54; }
    .review-summary .uncertain { color: #a05f00; }

    .review-approve {

    .review-messages {
      grid-column: 1 / -1;

    .import-diagnostics {

    .import-diagnostics div {

    }

    .import-diagnostics span,
    .import-diagnostics strong {

    }

    .import-diagnostics span {
      color: rgba(11,17,16,0.58);
      font-size: 9px;
      font-weight: 900;

    .import-diagnostics strong {

    .review-field {

    .review-field label {

    .review-field input,
    .review-field select {

      padding: 0 10px;
      border: 1px solid rgba(11,17,16,0.18);

    .remove-draft {

    .import-notice {

      padding: 12px 14px;
      border-left: 4px solid #0b9766;

    .scan-audit {

    .scan-audit-row {

    .scan-audit-data span,
    .scan-audit-data strong { display: block; }
    .scan-audit-data span { color: rgba(11,17,16,.56); font-size: 9px; font-weight: 900; text-transform: uppercase; }
    .scan-audit-data strong { margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }

    .bet-header {

    .bet-header span:nth-child(2),
    .bet-header span:nth-child(3) {

    .bet-header span:nth-child(5),
    .bet-header span:nth-child(6),

    .drag-handle {
      width: 12px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(11,17,16,0.18);
      border-radius: 6px;
      background: rgba(255,255,255,0.48);
      color: rgba(11,17,16,0.52);
      cursor: grab;
      user-select: none;
      font-size: 9px;

    .drag-handle:active { cursor: grabbing; }
    .bet.is-dragging { opacity: .45; }
    .bet.drag-over { box-shadow: inset 0 3px 0 var(--gold); }

    .import-error {

    @media (max-width: 980px) {
      .hero,
      .match-top {
        grid-template-columns: 1fr;
      }

      .review-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .bet-header { grid-template-columns: 18px 24px 44px minmax(180px, 1fr) 78px 96px; }
      .bet-header span:nth-child(7) { grid-column: 3 / -1; text-align: right; }
      .bet-header span:last-child { display: none; }

      .delete-bet {
        position: absolute;

      .review-row.has-source {
        grid-template-columns: 150px repeat(2, minmax(0, 1fr));

      .import-diagnostics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .selection {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .selection-copy {
        grid-column: 1 / -1;
      }

      .match-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .bet {
        grid-template-columns: 18px 24px 44px minmax(180px, 1fr) 78px 96px;
      }

      .sort {
        grid-template-columns: 18px 24px 44px minmax(180px, 1fr) 78px 96px;
      }

      .sort-reset {
        grid-column: 3;
      }

      .sort-odds {
        grid-column: 4;
      }

      .sort-stake {
        grid-column: 5;
      }

      .sort-payout {
        grid-column: 6;
        width: 100%;
        justify-self: stretch;
      }

      .payout {
        grid-column: 3 / -1;

        justify-content: space-between;
        align-items: baseline;
        gap: 12px;

    }

    @media (max-width: 680px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      h1 {
        font-size: 40px;
      }

      .scoreboard,
      .final {
        grid-template-columns: 1fr;
      }

      .hero-actions {
        align-items: stretch;
      }

      .import-trigger {
        width: 100%;
        justify-content: center;
      }

      .import-backdrop {
        padding: 0;
      }

      .import-panel {
        width: 100%;
        max-height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .import-body {
        padding: 14px;
      }

      .import-modes {
        width: 100%;
        grid-template-columns: 1fr 1fr;
      }

      .review-row {
        grid-template-columns: 1fr;
      }

      .scan-audit-row { grid-template-columns: 1fr; }
      .scan-audit-data { grid-template-columns: 1fr; }
      .bet-header { display: none; }

      .review-row.has-source {
        grid-template-columns: 1fr;
      }

      .review-source {
        grid-row: auto;
      }

      .review-source img {
        max-height: 240px;
      }

      .import-diagnostics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .import-actions {
        display: grid;
        padding: 12px 14px;
      }

      .import-actions > div,
      .import-actions button {
        width: 100%;
      }

      .import-actions button {
        justify-content: center;
      }

      .selection {
        position: static;
        grid-template-columns: 1fr;
      }

      .selection-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .selection button {
        min-height: 48px;
      }

      .selection-actions button {
        min-height: 44px;
      }

      .match-title-row {
        align-items: flex-start;
      }

      .delete-match {
        width: 40px;
        min-height: 40px;
        justify-content: center;
        padding: 0;
        font-size: 0;
      }

      .delete-match::before {
        content: "×";
        font-size: 22px;
      }

      .match-title h2 {
        flex-wrap: wrap;
      }

      .match-title b {
        min-width: 82px;
        font-size: 30px;
      }

      .bet {
        grid-template-columns: 42px 42px 46px minmax(0, 1fr);
      }

      .sort {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .sort-reset,
      .sort-odds,
      .sort-stake,
      .sort-payout {
        grid-column: auto;
        width: 100%;
        justify-self: stretch;
      }

      .select-bet label {
        width: 30px;
        height: 34px;
      }

      .marker {
        width: 38px;
        height: 38px;
      }

      .main {
        grid-column: 4;
      }

      .num,
      .payout {
        grid-column: 4;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        text-align: left;
      }

      .num > span {
        display: block;
        margin: 0;
      }

      .payout em {

      .match-footer {

<body>
  <div class="shell" id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const CAT = {
      result: { label: 'Resultat', short: 'RES', color: '#c96a2b' },
      player: { label: 'Spiller', short: 'SP', color: '#2f72ff' },
      match: { label: 'Kamp', short: 'KAMP', color: '#12a88f' },
      stats: { label: 'Statistikk', short: 'STAT', color: '#2fbf71' },
      timing: { label: 'Timing', short: 'TID', color: '#8d63e6' },
      special: { label: 'Spesial', short: 'VIP', color: '#d83f7b' },
    };

    const SORT_OPTIONS = [
      { key: 'default', label: 'Original' },
      { key: 'odds', label: 'Odds' },
      { key: 'stake', label: 'Innsats' },
      { key: 'payout', label: 'Mulig premie' },
    ];

    const MATCHES = [];
    const ALL_BETS = [];

    const STORAGE_KEY = 'oddsen-tracker-workspace-v3';
    const importState = {
      open: false,
      mode: 'image',
      step: 'source',
      text: '',
      files: [],
      drafts: [],
      busy: false,
      error: '',
      progress: 0,
      status: '',
      session: null,
      notice: null,
      lastScanDrafts: [],
    };

    const confirmState = {
      open: false,
      title: '',
      message: '',
      ids: [],
    };

    const esc = (value = '') => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const parseNumber = (value) => {
      let normalized = String(value ?? '').replace(/kr/gi, '').replace(/\s/g, '');
      if (!normalized) return 0;

      if (normalized.includes(',')) {
        normalized = normalized.replace(/\./g, '').replace(',', '.');
      } else {
        const parts = normalized.split('.');
        if (parts.length > 2) normalized = `${parts.slice(0, -1).join('')}.${parts.at(-1)}`;
      }

      const number = Number.parseFloat(normalized.replace(/[^0-9.-]/g, ''));
      return Number.isFinite(number) ? number : 0;
    };

    const cleanField = (value = '') => String(value)
      .replace(/[|]/g, ' ')
      .replace(/\s+/g, ' ')
      .replace(/^[\s:.-]+|[\s:.-]+$/g, '')
      .trim();


    const normalizeIdentityText = (value = '') => cleanField(value)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\b(?:fk|fc|cf|afc)\b/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    const normalizeKickoff = (value = '') => normalizeIdentityText(value)
      .replace(/\b(?:man|tir|ons|tor|fre|lor|son)(?:dag)?\b/g, '')
      .replace(/\bkl\b/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    const isPlaceholder = (value = '') => /^(?:Importert kupong|Ukjent spilltype|Spilltype ikke oppgitt|Kontroller utfall)$/i.test(cleanField(value));

    const inferCategory = (market = '') => {
      const value = market.toLowerCase();
      if (/korrekt|resultat|halvtid\s*\/\s*fulltid/.test(value)) return 'result';
      if (/tidspunkt|minutt/.test(value)) return 'timing';
      if (/begge lag|over|under|antall mål|hub/.test(value)) return 'match';
      if (/scorer|spiller|assist|heading|frispark|hat.?trick/.test(value)) return 'player';
      if (/statistikk|kort|corner|takling|skudd/.test(value)) return 'stats';
      if (/vinner.*vm|mester|turnering|spesial/.test(value)) return 'special';
      return 'match';
    };

    const blankDraft = () => ({
      match: '',
      market: '',
      selection: '',
      odds: '',
      stake: '',
      payout: '',
      category: 'match',
      coupon: '',
      kickoff: '',
    });

    function parseImportText(rawText, source = 'text') {
      const text = String(rawText || '')
        .replace(/\r/g, '')
        .replace(/[‐‑‒–—]/g, '-')
        .replace(/Mulig\s+Premie/gi, 'Mulig Premie');

      const summaryPattern = /innsats\s*:?\s*([0-9][0-9 .]*(?:,[0-9]{1,2})?)[\s\S]{0,100}?\bOdds\s*:?\s*([0-9]+(?:[.,][0-9]+)?)[\s\S]{0,80}?Mulig\s+Premie\s*:?\s*([0-9][0-9 .]*(?:,[0-9]{1,2})?)/gi;
      const summaries = [...text.matchAll(summaryPattern)];

      return summaries.map((summary, index) => {
        const start = summary.index;
        const end = summaries[index + 1]?.index ?? text.length;
        const block = text.slice(start, end);
        const marketMatch = block.match(/Spillobjekt\s*:?\s*([\s\S]*?)(?=\s*Spilt\s+utfall)/i);
        const selectionMatch = block.match(/Spilt\s+utfall\s*:?\s*([\s\S]*?)(?=\s*(?:Levert|Kupongnummer|$))/i);
        const matchLine = block.match(/(?:^|\n)\s*\d+\.\s*([^\n]{2,90})/m);
        const kickoffMatch = block.match(/Starttid\s*:?\s*([\s\S]*?)(?=\s*(?:Konkurranse|Spillobjekt))/i);
        const couponMatch = block.match(/Kupongnummer\s*:?\s*([0-9.]+)/i);

        let market = cleanField(marketMatch?.[1] || 'Ukjent spilltype');
        let selection = cleanField(selectionMatch?.[1] || 'Kontroller utfall');
        const odds = parseNumber(summary[2]);
        const trailingOdds = new RegExp(`\\s+${String(summary[2]).replace('.', '\\.')}$`);
        selection = selection.replace(trailingOdds, '').trim();
        if (/scorer|assist|heading|frispark|spiller/i.test(market)) selection = selection.replace(/\s+Ja$/i, '');

        const match = cleanField(matchLine?.[1] || 'Importert kupong');
        const stake = parseNumber(summary[1]);
        const payout = parseNumber(summary[3]) || stake * odds;
        const markers = [...block.matchAll(/(?:^|\n)\s*\d+\.\s*([^\n]{2,90})/gm)];
        const selections = markers.length > 1 ? markers.map((marker, markerIndex) => {
          const section = block.slice(marker.index, markers[markerIndex + 1]?.index ?? block.length);
          const sectionMarket = cleanField(section.match(/Spillobjekt\s*:?\s*([\s\S]*?)(?=\s*Spilt\s+utfall)/i)?.[1] || 'Ukjent spilltype');
          const sectionSelectionMatch = section.match(/Spilt\s+utfall\s*:?\s*([\s\S]*?)(?=\s*(?:Levert|Kupongnummer|\n\s*\d+\.|$))/i);
          const sectionKickoff = cleanField(section.match(/Starttid\s*:?\s*([\s\S]*?)(?=\s*(?:Konkurranse|Spillobjekt))/i)?.[1] || '');
          let sectionSelection = cleanField(sectionSelectionMatch?.[1] || 'Kontroller utfall');
          const sectionOddsMatch = sectionSelection.match(/\s+([0-9]+(?:[.,][0-9]+)?)$/);
          const sectionOdds = parseNumber(sectionOddsMatch?.[1]);
          if (sectionOddsMatch) sectionSelection = sectionSelection.slice(0, sectionOddsMatch.index).trim();
          return {
            match: cleanField(marker[1]),
            market: sectionMarket,
            selection: sectionSelection,
            odds: sectionOdds || '',
            kickoff: sectionKickoff,
            category: inferCategory(sectionMarket),
          };
        }) : [{ match, market, selection, odds, kickoff: cleanField(kickoffMatch?.[1] || ''), category: inferCategory(market) }];

        return {
          match,
          market,
          selection,
          odds: odds || '',
          stake: stake || '',
          payout: payout || '',
          category: inferCategory(market),
          coupon: couponMatch?.[1] || '',
          kickoff: cleanField(kickoffMatch?.[1] || ''),
          source,
          selections,
        };
      });
    }

    function restoreImports() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        (saved.matches || []).forEach((savedMatch) => {
          const match = { ...savedMatch };
          const legacySpecial = normalizeIdentityText(match.away) === 'spesial' ||
            (!match.away && /(?:vm|em|turnering|mester|toppscorer|golden boot)/i.test(match.home || ''));
          if (legacySpecial) {
            match.kind = 'special';
            match.away = '';
            match.awayCode = '';
            match.homeCode = '';
          } else {
            match.kind = match.kind || 'match';
          }
          if (!MATCHES.some((existing) => existing.id === match.id)) MATCHES.push(match);
        });
        (saved.bets || []).forEach((bet) => {
          if (!ALL_BETS.some((existing) => existing.id === bet.id)) ALL_BETS.push(bet);
        });
      } catch (error) {
        console.warn('Kunne ikke lese lokalt lagrede spill.', error);
      }
    }

    restoreImports();

    const filters = Object.fromEntries(MATCHES.map((match) => [match.id, null]));
    const sortState = { key: 'default', direction: 'desc' };
    let draggedBetId = null;
    const selectedBetIds = new Set();
    const money = new Intl.NumberFormat('nb-NO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const fmtMoney = (value) => `${money.format(value)} kr`;
    const fmtOdds = (value) => value.toFixed(2);
    const net = (bet) => bet.payout - bet.stake;
    const tier = (odds) => odds >= 25 ? 'moonshot' : odds >= 15 ? 'bold' : odds >= 7 ? 'sharp' : 'steady';
    const summary = (bets) => bets.reduce((acc, bet) => {
      acc.stake += bet.stake;
      acc.payout += bet.payout;
      acc.bestPayout = Math.max(acc.bestPayout, bet.payout);
      acc.highestOdds = Math.max(acc.highestOdds, bet.odds);
      acc.net += net(bet);
      return acc;
    }, { stake: 0, payout: 0, bestPayout: 0, highestOdds: 0, net: 0 });
    const counts = (bets) => bets.reduce((acc, bet) => {
      acc[bet.category] = (acc[bet.category] || 0) + 1;
      return acc;
    }, {});
    const sortBets = (bets) => {
      if (sortState.key === 'default') return bets;
      const direction = sortState.direction === 'asc' ? 1 : -1;

      return [...bets].sort((a, b) => {
        const diff = (a[sortState.key] - b[sortState.key]) * direction;
        return diff || ALL_BETS.indexOf(a) - ALL_BETS.indexOf(b);
      });
    };
    const stat = (label, value, tone = '', eyebrow = '') => `<div class="stat ${tone}"><span>${label}</span><strong>${value}</strong>${eyebrow ? `<em>${eyebrow}</em>` : ''}</div>`;

    const slug = (value) => String(value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '')
      .slice(0, 42);

    const teamCode = (team) => {
      const known = { norge: 'NOR', england: 'ENG', frankrike: 'FRA', marokko: 'MAR', spania: 'ESP', argentina: 'ARG' };
      const normalized = String(team || '').toLowerCase().trim();
      return known[normalized] || String(team || 'SP').replace(/[^A-Za-zÆØÅæøå]/g, '').slice(0, 3).toUpperCase() || 'SP';
    };

    function parseMatchLabel(label) {
      const cleaned = cleanField(label).replace(/^\d+\.\s*/, '');
      const parts = cleaned.split(/\s+(?:v|vs\.?|mot)\s+/i);
      if (parts.length >= 2) {
        return {
          kind: 'match',
          home: parts[0],
          away: parts.slice(1).join(' v '),
        };
      }

      return {
        kind: 'special',
        home: cleaned || 'Turneringsspill',
        away: '',
      };
    }

    const isSpecialMatch = (match) => match?.kind === 'special' || normalizeIdentityText(match?.away) === 'spesial';

    function ensureMatch(label, kickoff = '') {
      const parsed = parseMatchLabel(label);
      const { kind, home, away } = parsed;
      const incomingKickoff = normalizeKickoff(kickoff);
      const incomingTeams = kind === 'match'
        ? [normalizeIdentityText(home), normalizeIdentityText(away)].sort().join('|')
        : '';
      const incomingEvent = kind === 'special' ? normalizeIdentityText(home) : '';

      const existing = MATCHES.find((match) => {
        const existingKind = isSpecialMatch(match) ? 'special' : 'match';
        if (existingKind !== kind) return false;

        const sameIdentity = kind === 'special'
          ? normalizeIdentityText(match.home) === incomingEvent
          : [normalizeIdentityText(match.home), normalizeIdentityText(match.away)].sort().join('|') === incomingTeams;
        if (!sameIdentity) return false;

        const existingKickoff = normalizeKickoff(match.kickoff);
        return !incomingKickoff || !existingKickoff || incomingKickoff === existingKickoff;
      });

      if (existing) {
        existing.kind = kind;
        if (kind === 'special') {
          existing.away = '';
          existing.homeCode = '';
          existing.awayCode = '';
        }
        if ((!existing.kickoff || existing.kickoff === 'Tidspunkt ikke registrert') && kickoff) existing.kickoff = kickoff;
        return existing.id;
      }

      const identity = kind === 'special' ? `${home}-special-${incomingKickoff}` : `${home}-${away}-${incomingKickoff}`;
      const baseId = slug(identity) || `importert-${Date.now()}`;
      let id = baseId;
      let suffix = 2;
      while (MATCHES.some((match) => match.id === id)) id = `${baseId}-${suffix++}`;

      MATCHES.push({
        id,
        kind,
        round: kind === 'special' ? 'Turneringsspill' : 'Importert',
        home,
        away,
        homeCode: kind === 'match' ? teamCode(home) : '',
        awayCode: kind === 'match' ? teamCode(away) : '',
        kickoff: kickoff || 'Tidspunkt ikke registrert',
        venue: 'Mine kuponger',
        accent: '#d8aa49',
        rival: '#10a66f',
        imported: true,
      });
      filters[id] = null;
      return id;
    }

    function saveImports() {
      try {
        const bets = ALL_BETS.filter((bet) => bet.imported);
        const matchIds = new Set(bets.map((bet) => bet.matchId));
        const matches = MATCHES.filter((match) => match.imported && matchIds.has(match.id));
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ matches, bets }));
      } catch (error) {
        console.warn('Kunne ikke lagre importerte spill lokalt.', error);
      }
    }

    function resetImportState() {
      importState.files.forEach((item) => URL.revokeObjectURL(item.url));
      Object.assign(importState, {
        open: false,
        mode: 'image',
        step: 'source',
        text: '',
        files: [],
        drafts: [],
        busy: false,
        error: '',
        progress: 0,
        status: '',
        session: null,
        notice: null,
        lastScanDrafts: [],
      });
    }

    function startAdditionalImport() {
      importState.files.forEach((item) => URL.revokeObjectURL(item.url));
      Object.assign(importState, {
        open: true,
        mode: 'image',
        step: 'source',
        text: '',
        files: [],
        drafts: [],
        busy: false,
        error: '',
        progress: 0,
        status: '',
        session: null,
        notice: null,
        lastScanDrafts: [],
      });
      render();
    }

    function addImageFiles(fileList) {
      const files = [...fileList].filter((file) => file.type.startsWith('image/'));
      const room = Math.max(0, 12 - importState.files.length);
      files.slice(0, room).forEach((file) => {
        importState.files.push({ file, url: URL.createObjectURL(file) });
      });
      importState.error = files.length ? '' : 'Velg bildefiler som PNG, JPG eller WEBP.';
      render();
    }

    function updateOcrProgress(progress, status) {
      importState.progress = Math.max(0, Math.min(1, progress || 0));
      importState.status = status || 'Leser skjermbilder';
      const track = document.querySelector('.ocr-track i');
      const label = document.querySelector('.ocr-status span');
      if (track) track.style.setProperty('--progress', `${Math.round(importState.progress * 100)}%`);
      if (label) label.textContent = `${importState.status} · ${Math.round(importState.progress * 100)} %`;
    }

    async function sha256(file) {
      const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
      return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    const brightness = (data, width, x, y) => {
      const offset = ((y * width) + x) * 4;
      return (data[offset] + data[offset + 1] + data[offset + 2]) / 3;
    };

    function findRuns(values, predicate, minimumLength = 1) {
      const runs = [];
      let start = null;
      values.forEach((value, index) => {
        if (predicate(value) && start === null) start = index;
        if (start !== null && (!predicate(value) || index === values.length - 1)) {
          const end = predicate(value) && index === values.length - 1 ? index + 1 : index;
          if (end - start >= minimumLength) runs.push({ start, end });
          start = null;
        }
      });
      return runs;
    }

    function mergeRuns(runs, maximumGap) {
      return runs.reduce((merged, run) => {
        const previous = merged.at(-1);
        if (previous && run.start - previous.end <= maximumGap) previous.end = run.end;
        else merged.push({ ...run });
        return merged;
      }, []);
    }

    function detectColumns(imageData) {
      const { width, height, data } = imageData;
      const yStart = Math.max(0, Math.floor(height * 0.065));
      const yEnd = Math.min(height, Math.ceil(height * 0.94));
      const yStep = Math.max(1, Math.floor((yEnd - yStart) / 900));
      const gutterScores = [];

      for (let x = 0; x < width; x += 1) {
        let bright = 0;
        let samples = 0;
        for (let y = yStart; y < yEnd; y += yStep) {
          if (brightness(data, width, x, y) > 251) bright += 1;
          samples += 1;
        }
        gutterScores.push(bright / Math.max(1, samples));
      }

      const gutterRuns = findRuns(gutterScores, (score) => score < 0.07, Math.max(6, Math.round(width * 0.006)));
      const boundaries = [0, ...gutterRuns.map((run) => Math.round((run.start + run.end) / 2)), width]
        .filter((value, index, list) => index === 0 || value - list[index - 1] > width * 0.12);
      if (boundaries.at(-1) !== width) boundaries.push(width);

      const columns = [];
      for (let index = 0; index < boundaries.length - 1; index += 1) {
        const x = boundaries[index];
        const next = boundaries[index + 1];
        if (next - x >= width * 0.18) columns.push({ x, width: next - x });
      }
      return columns.length ? columns : [{ x: 0, width }];
    }

    function detectRowsForColumn(imageData, column) {
      const { width, height, data } = imageData;
      const xStart = Math.max(0, column.x + Math.max(5, Math.floor(column.width * 0.025)));
      const xEnd = Math.min(width, column.x + column.width - Math.max(5, Math.floor(column.width * 0.025)));
      const yStart = Math.max(0, Math.floor(height * 0.06));
      const yEnd = Math.min(height, Math.ceil(height * 0.95));
      const sampleCount = 31;
      const medians = [];

      for (let y = yStart; y < yEnd; y += 1) {
        const samples = [];
        for (let sample = 0; sample < sampleCount; sample += 1) {
          const x = Math.round(xStart + ((xEnd - xStart - 1) * sample / (sampleCount - 1)));
          samples.push(brightness(data, width, x, y));
        }
        samples.sort((a, b) => a - b);
        medians.push(samples[Math.floor(samples.length / 2)]);
      }

      const rawRuns = findRuns(medians, (value) => value > 251, 2)
        .map((run) => ({ start: run.start + yStart, end: run.end + yStart }));
      const merged = mergeRuns(rawRuns, Math.max(8, Math.round(height * 0.004)));
      return merged.filter((run) => run.end - run.start >= Math.max(80, height * 0.075));
    }

    async function ingestAndSegment(file, fileIndex) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const context = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(bitmap, 0, 0);
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const hash = await sha256(file);
      const sourceImage = {
        id: `image-${fileIndex}-${hash.slice(0, 12)}`,
        name: file.name || `skjermbilde-${fileIndex + 1}`,
        mimeType: file.type || 'image/unknown',
        size: file.size,
        sha256: hash,
        width: bitmap.width,
        height: bitmap.height,
      };

      const columns = detectColumns(imageData);
      const boxes = columns.flatMap((column) => detectRowsForColumn(imageData, column).map((row) => {
        const padding = Math.max(6, Math.round(bitmap.width * 0.006));
        const x = Math.max(0, column.x + padding);
        const y = Math.max(0, row.start - padding);
        const right = Math.min(bitmap.width, column.x + column.width - padding);
        const bottom = Math.min(bitmap.height, row.end + padding);
        return { x, y, width: right - x, height: bottom - y };
      }));

      boxes.sort((a, b) => a.x - b.x || a.y - b.y);
      const regions = boxes.map((box, regionIndex) => {
        const scale = Math.min(3, Math.max(1, 980 / box.width));
        const crop = document.createElement('canvas');
        crop.width = Math.round(box.width * scale);
        crop.height = Math.round(box.height * scale);
        const cropContext = crop.getContext('2d', { alpha: false });
        cropContext.fillStyle = '#ffffff';
        cropContext.fillRect(0, 0, crop.width, crop.height);
        cropContext.imageSmoothingEnabled = true;
        cropContext.imageSmoothingQuality = 'high';
        cropContext.drawImage(bitmap, box.x, box.y, box.width, box.height, 0, 0, crop.width, crop.height);
        return {
          id: `${sourceImage.id}-region-${regionIndex + 1}`,
          sourceImageId: sourceImage.id,
          box,
          previewUrl: crop.toDataURL('image/jpeg', 0.92),
          ocrImage: crop.toDataURL('image/png'),
          touchesImageEdge: box.x <= 1 || box.y <= 1 || box.x + box.width >= bitmap.width - 1 || box.y + box.height >= bitmap.height - 1,
          column: columns.findIndex((column) => box.x >= column.x && box.x < column.x + column.width) + 1,
        };
      });

      bitmap.close();
      return { sourceImage, regions, columnCount: columns.length };
    }

    const tracedField = (rawValue, normalizedValue, confidence, sourceRegion, messages = []) => ({
      rawValue: String(rawValue ?? ''),
      normalizedValue: normalizedValue ?? null,
      confidence,
      status: normalizedValue === null || normalizedValue === '' ? 'missing' : (messages.length ? 'uncertain' : 'confirmed'),
      sourceRegion: sourceRegion || null,
      validationMessages: [...messages],
    });

    function validateImageDraft(draft) {
      const blockingErrors = [];
      const warnings = [];

      const match = cleanField(draft.match);
      const market = cleanField(draft.market);
      const selection = cleanField(draft.selection);
      const coupon = cleanField(draft.coupon);
      const kickoff = cleanField(draft.kickoff);

      if (!match || isPlaceholder(match)) blockingErrors.push('Kamp mangler eller kunne ikke identifiseres.');
      if (!selection || isPlaceholder(selection)) blockingErrors.push('Spilt utfall mangler.');
      if (!market || isPlaceholder(market)) {
        draft.market = 'Spilltype ikke oppgitt';
        draft.category = 'match';
        warnings.push('Spilltype mangler, men kupongen kan importeres med generisk spilltype.');
      }
      if (!coupon) warnings.push('Kupongnummer mangler; duplikatkontroll blir mindre presis.');
      if (!kickoff) warnings.push('Kampstart mangler; kampen kobles primært etter lagene.');

      const odds = parseNumber(draft.odds);
      const stake = parseNumber(draft.stake);
      const payout = parseNumber(draft.payout);
      if (!(odds > 1)) blockingErrors.push('Odds mangler eller er ugyldig.');
      if (!(stake > 0)) blockingErrors.push('Innsats mangler eller er ugyldig.');
      if (!(payout > 0)) warnings.push('Mulig premie mangler og beregnes fra innsats × odds.');
      if (odds > 1 && stake > 0 && payout > 0) {
        const expected = odds * stake;
        const tolerance = Math.max(1, payout * 0.02);
        if (Math.abs(expected - payout) > tolerance) {
          blockingErrors.push(`Økonomiavvik: ${fmtMoney(stake)} × ${fmtOdds(odds)} er ${fmtMoney(expected)}, ikke ${fmtMoney(payout)}.`);
        }
      }
      if (draft.region?.touchesImageEdge) warnings.push('Kupongregionen berører bildekanten.');

      draft.blockingErrors = blockingErrors;
      draft.warnings = warnings;
      draft.validationMessages = [...blockingErrors, ...warnings];
      draft.status = blockingErrors.length ? 'uncertain' : 'complete';
      draft.approved = blockingErrors.length === 0;
      return draft;
    }

    function reconcileDraftContexts(drafts) {
      const knownByKickoff = new Map();
      const allKnownMatches = new Set();

      drafts.forEach((draft) => {
        const match = cleanField(draft.match);
        if (!match || isPlaceholder(match)) return;
        allKnownMatches.add(match);
        const key = normalizeKickoff(draft.kickoff);
        if (!key) return;
        if (!knownByKickoff.has(key)) knownByKickoff.set(key, new Set());
        knownByKickoff.get(key).add(match);
      });

      drafts.forEach((draft) => {
        const missingMatch = !cleanField(draft.match) || isPlaceholder(draft.match);
        if (missingMatch) {
          const key = normalizeKickoff(draft.kickoff);
          const candidates = key ? [...(knownByKickoff.get(key) || [])] : [];
          if (candidates.length === 1) {
            draft.match = candidates[0];
            draft.contextInferred = true;
          } else if (!key && allKnownMatches.size === 1) {
            draft.match = [...allKnownMatches][0];
            draft.contextInferred = true;
          }
        }
        validateImageDraft(draft);
        if (draft.contextInferred) draft.warnings.unshift('Kampen ble koblet automatisk fra lag og kampstart i de øvrige kupongene.');
        draft.validationMessages = [...draft.blockingErrors, ...draft.warnings];
      });
      return drafts;
    }

    function importDraftCollection(drafts) {
      const knownCoupons = new Set(ALL_BETS.map((bet) => bet.coupon).filter(Boolean));
      const fresh = drafts.filter((draft) => !draft.coupon || !knownCoupons.has(cleanField(draft.coupon)));

      fresh.forEach((draft, index) => {
        const odds = parseNumber(draft.odds);
        const stake = parseNumber(draft.stake);
        const payout = parseNumber(draft.payout) || odds * stake;
        const market = cleanField(draft.market) || 'Spilltype ikke oppgitt';
        ALL_BETS.push({
          id: `import-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 7)}`,
          matchId: ensureMatch(draft.match, draft.kickoff),
          market,
          selection: cleanField(draft.selection),
          odds,
          stake,
          payout,
          category: CAT[draft.category] ? draft.category : inferCategory(market),
          coupon: cleanField(draft.coupon),
          imported: true,
        });
      });

      if (fresh.length) saveImports();
      return { imported: fresh.length, duplicates: drafts.length - fresh.length };
    }

    function buildImageDraft(region, text, ocrConfidence) {
      const parsed = parseImportText(text, 'image');
      const draft = parsed[0] || blankDraft();
      const confidence = Math.max(0, Math.min(1, Number(ocrConfidence || 0) / 100));
      Object.assign(draft, {
        source: 'image',
        sourceRegionId: region.id,
        region,
        rawText: text,
        ocrConfidence: confidence,
        approved: true,
        extractionsInRegion: parsed.length,
      });
      if (parsed.length > 1) {
        draft.validationMessages = [`Regionen ga ${parsed.length} mulige kuponger og må deles manuelt.`];
      }
      validateImageDraft(draft);
      if (draft.selections?.length > 1) {
        draft.status = 'uncertain';
        draft.validationMessages.push(`Kombinasjonskupong med ${draft.selections.length} delspill må kontrolleres manuelt.`);
      }
      if (parsed.length !== 1) {
        draft.status = parsed.length ? 'uncertain' : 'rejected';
        draft.validationMessages.push(parsed.length ? 'Flere økonomiblokker ble funnet i samme region.' : 'Ingen komplett økonomiblokk ble lest i regionen.');
      }

      const box = region.box;
      draft.fields = {
        match: tracedField(draft.match, cleanField(draft.match) || null, confidence, box),
        market: tracedField(draft.market, cleanField(draft.market) || null, confidence, box),
        selection: tracedField(draft.selection, cleanField(draft.selection) || null, confidence, box),
        odds: tracedField(draft.odds, parseNumber(draft.odds) || null, confidence, box),
        stake: tracedField(draft.stake, parseNumber(draft.stake) || null, confidence, box),
        payout: tracedField(draft.payout, parseNumber(draft.payout) || null, confidence, box),
        coupon: tracedField(draft.coupon, cleanField(draft.coupon) || null, confidence, box),
        kickoff: tracedField(draft.kickoff, cleanField(draft.kickoff) || null, confidence, box),
      };
      return draft;
    }

    async function recognizeImages() {
      if (!importState.files.length || importState.busy) return;
      if (!window.Tesseract) {
        importState.error = 'Bildegjenkjenning krever internettilgang. Du kan fortsatt lime inn kupongteksten.';
        render();
        return;
      }

      importState.busy = true;
      importState.error = '';
      importState.status = 'Forbereder bildelesing';
      importState.progress = 0;
      render();

      let worker;
      const recognized = [];
      const drafts = [];

      try {
        updateOcrProgress(0, 'Forbereder bildeutsnitt');
        const jobs = [];
        const sourceImages = [];
        const imageDiagnostics = [];
        const seenHashes = new Set();
        for (let fileIndex = 0; fileIndex < importState.files.length; fileIndex += 1) {
          const segmented = await ingestAndSegment(importState.files[fileIndex].file, fileIndex);
          sourceImages.push(segmented.sourceImage);
          if (seenHashes.has(segmented.sourceImage.sha256)) {
            imageDiagnostics.push({ sourceImageId: segmented.sourceImage.id, status: 'duplicate', detectedRegions: segmented.regions.length });
            continue;
          }
          seenHashes.add(segmented.sourceImage.sha256);
          segmented.regions.forEach((region) => jobs.push({ region, fileIndex }));
          imageDiagnostics.push({
            sourceImageId: segmented.sourceImage.id,
            status: segmented.regions.length ? 'segmented' : 'rejected',
            columns: segmented.columnCount,
            detectedRegions: segmented.regions.length,
          });
        }

        if (!jobs.length) throw new Error('Ingen kupongregioner ble oppdaget.');

        worker = await Tesseract.createWorker('nor+eng', 1, {
          logger: (message) => {
            const jobShare = 1 / jobs.length;
            const jobIndex = Math.max(0, recognized.length);
            const progress = (jobIndex * jobShare) + ((message.progress || 0) * jobShare);
            updateOcrProgress(progress, message.status === 'recognizing text' ? 'Leser kupongtekst' : 'Laster språkmodell');
          },
        });

        for (let index = 0; index < jobs.length; index += 1) {
          const job = jobs[index];
          updateOcrProgress(index / jobs.length, `Leser bilde ${job.fileIndex + 1}, kupong ${index + 1} av ${jobs.length}`);
          const result = await worker.recognize(job.region.ocrImage);
          const text = result.data.text || '';
          recognized.push({ regionId: job.region.id, text });
          drafts.push(buildImageDraft(job.region, text, result.data.confidence));
        }

        const complete = drafts.filter((draft) => draft.status === 'complete').length;
        const uncertain = drafts.filter((draft) => draft.status === 'uncertain').length;
        const rejected = drafts.filter((draft) => draft.status === 'rejected').length;
        importState.session = {
          id: `session-${Date.now()}`,
          createdAt: new Date().toISOString(),
          sourceImages,
          regions: jobs.map((job) => ({
            id: job.region.id,
            sourceImageId: job.region.sourceImageId,
            box: job.region.box,
            touchesImageEdge: job.region.touchesImageEdge,
            column: job.region.column,
          })),
          coupons: drafts.map((draft) => ({
            sourceRegionId: draft.sourceRegionId,
            status: draft.status,
            approved: draft.approved,
            fields: draft.fields,
            validationMessages: draft.validationMessages,
          })),
          diagnostics: {
            images: imageDiagnostics,
            detectedRegions: jobs.length,
            analyzedCoupons: drafts.length,
            completeCoupons: complete,
            uncertainCoupons: uncertain,
            rejectedCoupons: rejected,
            failClosed: drafts.length !== jobs.length || uncertain > 0 || rejected > 0,
          },
        };
        importState.text = recognized.map((item) => `[${item.regionId}]\n${item.text}`).join('\n\n--- NY REGION ---\n\n');
        reconcileDraftContexts(drafts);

        const automatic = drafts.filter((draft) => draft.status === 'complete');
        const reviewRequired = drafts.filter((draft) => draft.status !== 'complete');
        const result = importDraftCollection(automatic);

        importState.lastScanDrafts = drafts;
        importState.drafts = reviewRequired;
        importState.step = reviewRequired.length ? 'review' : 'success';
        importState.notice = `${result.imported} kuponger ble importert automatisk${result.duplicates ? `; ${result.duplicates} duplikater ble hoppet over` : ''}.`;
        importState.error = reviewRequired.length
          ? `${reviewRequired.length} kuponger krever kontroll fordi vesentlig informasjon mangler eller er inkonsistent.`
          : '';
      } catch (error) {
        console.error(error);
        importState.error = 'Bildene kunne ikke leses. Prøv et tydeligere utsnitt, eller lim inn teksten.';
      } finally {
        if (worker) await worker.terminate();
        importState.busy = false;
        importState.progress = 1;
        render();
      }
    }

    function commitDrafts() {
      if (importState.session && importState.session.diagnostics.analyzedCoupons < importState.session.diagnostics.detectedRegions) {
        importState.error = 'Import stoppet: ikke alle oppdagede regioner er analysert.';
        render();
        return;
      }

      reconcileDraftContexts(importState.drafts);
      const valid = importState.drafts.filter((draft) =>
        draft.status === 'complete' &&
        cleanField(draft.match) && cleanField(draft.selection) &&
        parseNumber(draft.odds) > 1 && parseNumber(draft.stake) > 0
      );

      if (!valid.length) {
        importState.error = 'Ingen kuponger er klare. Korriger bare feltene som er markert som vesentlige.';
        render();
        return;
      }

      const result = importDraftCollection(valid);
      importState.drafts = importState.drafts.filter((draft) => !valid.includes(draft));

      if (!importState.drafts.length) {
        resetImportState();
      } else {
        importState.error = `${result.imported} kuponger importert. ${importState.drafts.length} krever fortsatt kontroll.`;
      }
      render();
    }

    function removeBets(ids) {
      const removeIds = new Set(ids);
      for (let index = ALL_BETS.length - 1; index >= 0; index -= 1) {
        if (removeIds.has(ALL_BETS[index].id)) ALL_BETS.splice(index, 1);
      }
      removeIds.forEach((id) => selectedBetIds.delete(id));

      for (let index = MATCHES.length - 1; index >= 0; index -= 1) {
        const match = MATCHES[index];
        if (!ALL_BETS.some((bet) => bet.matchId === match.id)) {
          MATCHES.splice(index, 1);
          delete filters[match.id];
        }
      }

      saveImports();
      render();
    }

    function removeMatch(matchId) {
      const ids = ALL_BETS.filter((bet) => bet.matchId === matchId).map((bet) => bet.id);
      removeBets(ids);
    }

        addImageFiles(event.dataTransfer.files);
      });
      imageInput?.addEventListener('change', () => addImageFiles(imageInput.files));

      document.querySelectorAll('[data-remove-image]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const index = Number(button.dataset.removeImage);
          const [removed] = importState.files.splice(index, 1);
          if (removed) URL.revokeObjectURL(removed.url);
          render();
        });
      });

      document.querySelector('.parse-import')?.addEventListener('click', () => {
        if (importState.mode === 'image') {
          recognizeImages();
          return;
        }

        importState.text = document.querySelector('#import-text')?.value || '';
        importState.drafts = parseImportText(importState.text, 'text');
        if (!importState.drafts.length) {
          importState.error = 'Fant ingen komplette spill. Kontroller at teksten inneholder innsats, odds og mulig premie.';
        } else {
          importState.step = 'review';
          importState.error = '';
        }
        render();
      });

      document.querySelector('.import-back')?.addEventListener('click', () => {
        importState.step = 'source';
        importState.error = '';
        render();
      });

      document.querySelector('.manual-import')?.addEventListener('click', () => {
        importState.drafts = [blankDraft()];
        importState.step = 'review';
        importState.error = '';
        render();
      });

      document.querySelector('.add-draft')?.addEventListener('click', () => {
        importState.drafts.push(blankDraft());
        importState.error = '';
        render();
      });

      document.querySelectorAll('[data-draft][data-field]').forEach((field) => {
        field.addEventListener('input', () => {
          const draft = importState.drafts[Number(field.dataset.draft)];
          if (draft) draft[field.dataset.field] = field.value;
        });
        field.addEventListener('change', () => {
          const draft = importState.drafts[Number(field.dataset.draft)];
          if (draft) {
            draft[field.dataset.field] = field.value;
            if (draft.source === 'image') {
              validateImageDraft(draft);
              render();
            }
          }
        });
      });

      document.querySelectorAll('[data-remove-draft]').forEach((button) => {
        button.addEventListener('click', () => {
          importState.drafts.splice(Number(button.dataset.removeDraft), 1);
          render();
        });
      });

      document.querySelector('.commit-import')?.addEventListener('click', commitDrafts);

      document.querySelector('.export-diagnostics')?.addEventListener('click', () => {
        if (!importState.session) return;
        const report = {
          ...importState.session,
          coupons: importState.drafts.map((draft) => ({
            sourceRegionId: draft.sourceRegionId || null,
            status: draft.status || 'complete',
            approved: Boolean(draft.approved),
            fields: draft.fields || null,
            validationMessages: draft.validationMessages || [],
            rawText: draft.rawText || '',
          })),
        };
        const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `${importState.session.id}-diagnostikk.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });


      document.querySelector('.import-done')?.addEventListener('click', () => {
        resetImportState();
        render();
      });

      document.querySelector('.show-scan-audit')?.addEventListener('click', () => {
        importState.step = 'audit';
        render();
      });

      document.querySelector('.import-more')?.addEventListener('click', startAdditionalImport);

      document.querySelector('.audit-back')?.addEventListener('click', () => {
        importState.step = importState.drafts.length ? 'review' : 'success';
        render();
      });

      document.querySelectorAll('[data-drag-bet]').forEach((row) => {
        row.addEventListener('dragstart', (event) => {
          draggedBetId = row.dataset.dragBet;
          row.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', draggedBetId);
        });
        row.addEventListener('dragend', () => {
          draggedBetId = null;
          document.querySelectorAll('.bet').forEach((item) => item.classList.remove('is-dragging', 'drag-over'));
        });
        row.addEventListener('dragover', (event) => {
          if (!draggedBetId || draggedBetId === row.dataset.dragBet) return;
          const dragged = ALL_BETS.find((bet) => bet.id === draggedBetId);
          const target = ALL_BETS.find((bet) => bet.id === row.dataset.dragBet);
          if (!dragged || !target || dragged.matchId !== target.matchId) return;
          event.preventDefault();
          row.classList.add('drag-over');
        });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', (event) => {
          event.preventDefault();
          row.classList.remove('drag-over');
          const fromIndex = ALL_BETS.findIndex((bet) => bet.id === draggedBetId);
          const toIndex = ALL_BETS.findIndex((bet) => bet.id === row.dataset.dragBet);
          if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return;
          const [moved] = ALL_BETS.splice(fromIndex, 1);
          const adjustedIndex = fromIndex < toIndex ? toIndex - 1 : toIndex;
          ALL_BETS.splice(adjustedIndex, 0, moved);
          sortState.key = 'default';
          sortState.direction = 'desc';
          saveImports();
          render();
        });
      });

      document.querySelectorAll('[data-delete-bet]').forEach((button) => {
        button.addEventListener('click', () => {
          const bet = ALL_BETS.find((item) => item.id === button.dataset.deleteBet);
          if (bet) openDeleteConfirmation('Slett kupong?', `${bet.market}: ${bet.selection} fjernes fra oversikten.`, [bet.id]);
        });
      });

      document.querySelectorAll('[data-delete-match]').forEach((button) => {
        button.addEventListener('click', () => {
          const match = MATCHES.find((item) => item.id === button.dataset.deleteMatch);
          const ids = ALL_BETS.filter((bet) => bet.matchId === button.dataset.deleteMatch).map((bet) => bet.id);
          if (match) openDeleteConfirmation('Slett hele kampen?', `${match.home} mot ${match.away} og alle ${ids.length} kupongene fjernes.`, ids);
        });
      });

      document.querySelectorAll('button[data-match]').forEach((button) => {
        button.addEventListener('click', () => {
          filters[button.dataset.match] = button.dataset.filter || null;
          render();
        });
      });

      document.querySelectorAll('input[data-bet]').forEach((input) => {
        input.addEventListener('change', () => {
          if (selectedBetIds.has(input.dataset.bet)) {
            selectedBetIds.delete(input.dataset.bet);
          } else {
            selectedBetIds.add(input.dataset.bet);
          }

          render();
        });
      });

      document.querySelectorAll('button[data-sort]').forEach((button) => {
        button.addEventListener('click', () => {
          const key = button.dataset.sort;

          if (key === 'default') {
            sortState.key = 'default';
            sortState.direction = 'desc';
          } else {
            sortState.direction = sortState.key === key && sortState.direction === 'desc' ? 'asc' : 'desc';
            sortState.key = key;
          }

          render();
        });
      });

      document.querySelector('.clear-selection')?.addEventListener('click', () => {
        selectedBetIds.clear();
        render();
      });

      document.querySelector('.delete-selected')?.addEventListener('click', () => {
        const ids = [...selectedBetIds];
        if (ids.length) openDeleteConfirmation('Slett markerte kuponger?', `${ids.length} markerte kuponger fjernes fra oversikten.`, ids);
      });

      document.querySelector('.confirm-cancel')?.addEventListener('click', () => {
        closeDeleteConfirmation();
        render();
      });

      document.querySelector('.confirm-delete')?.addEventListener('click', () => {
        const ids = [...confirmState.ids];
        closeDeleteConfirmation();
        removeBets(ids);
      });
    }

    render();

    document.addEventListener('paste', (event) => {
      if (!importState.open || importState.mode !== 'image' || importState.step !== 'source') return;
      const files = [...(event.clipboardData?.items || [])]
        .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (files.length) {
        event.preventDefault();
        addImageFiles(files);
      }
    });

    function runImportSelfTests() {
      const results = [];
      const check = (name, condition, details = '') => results.push({ name, passed: Boolean(condition), details });
      const receipt = (index, match = 'Norge v England') => `innsats: 100,00\nOdds: 2.10, Mulig Premie: 210,00\n1. ${match}\nStarttid: Lør. 11/7 23:00\nKonkurranse: Fotball-VM\nSpillobjekt: Scorer mål\nSpilt utfall: Erling Haaland\nLevert: 10.07.2026\nKupongnummer: ${index}.1`;
      const single = parseImportText(receipt(1));
      check('én kupong i tekst', single.length === 1);
      check('økonomifelt normaliseres', single[0]?.stake === 100 && single[0]?.odds === 2.1 && single[0]?.payout === 210);
      check('kampstart skilles fra leveringstid', single[0]?.kickoff === 'Lør. 11/7 23:00');
      check('spillobjekt og utfall holdes adskilt', single[0]?.market === 'Scorer mål' && single[0]?.selection === 'Erling Haaland');

      const ten = parseImportText(Array.from({ length: 10 }, (_, index) => receipt(index + 10, index < 7 ? 'Spania v Belgia' : 'Norge v England')).join('\n\n'));
      check('10 kuponger i tekst', ten.length === 10, `fant ${ten.length}`);
      check('flere kamper beholdes', new Set(ten.map((item) => item.match)).size === 2);

      const combo = parseImportText(`innsats: 100,00\nOdds: 6.00, Mulig Premie: 600,00\n1. Norge v England\nStarttid: Lør. 11/7 23:00\nSpillobjekt: HUB\nSpilt utfall: Norge 3.00\n2. Spania v Belgia\nStarttid: Fre. 10/7 21:00\nSpillobjekt: Begge lag scorer\nSpilt utfall: Ja 2.00\nKupongnummer: 99.1`);
      check('kombinasjonskupong får to delspill', combo[0]?.selections?.length === 2, `fant ${combo[0]?.selections?.length || 0}`);

      const conflicting = validateImageDraft({
        ...single[0],
        payout: 999,
        region: { touchesImageEdge: false },
      });
      check('økonomiavvik stoppes', conflicting.status === 'uncertain' && conflicting.validationMessages.some((message) => message.includes('Økonomiavvik')));
      check('komma og punktum normaliseres', parseNumber('1 825,00 kr') === 1825 && parseNumber('3.65') === 3.65);
      return { passed: results.every((result) => result.passed), results };
    }

    window.__oddsenImport = {
      parseImportText,
      parseNumber,
      inferCategory,
      ingestAndSegment,
      validateImageDraft,
      diagnostics: () => importState.session,
      runImportSelfTests,
    };

    if (new URLSearchParams(location.search).has('selftest')) {
      const report = runImportSelfTests();
      const output = document.createElement('pre');
      output.id = 'self-test-results';
      output.style.cssText = 'position:relative;z-index:50;margin:16px;padding:16px;background:#fff;color:#111;white-space:pre-wrap';
      output.textContent = JSON.stringify(report, null, 2);
      document.body.prepend(output);
    }
  </script>
</body>
</html>
